; Validation Password
password_min_length = 8
password_max_length = 16
password_regex = "^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':\"\\|,.<>\/?]).+$"

; Validation Pseudo
pseudo_min_length = 3
