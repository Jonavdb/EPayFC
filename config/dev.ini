pseudo_regex = "/^[a-zA-Z][a-zA-Z0-9]*$/"

; Validation IBAN (Regex pour BE + espaces)
iban_regex = "/^BE\d{2} \d{4} \d{4} \d{4}$/"
iban_format = "BE99 9999 9999 9999"

